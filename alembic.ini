# Alembic configuration file.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on Chinese Windows), so non-ASCII characters would break it.
#
# The database URL is NOT defined here on purpose: it is provided by
# app/core/config.py (settings.DATABASE_URL), see alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

[post_write_hooks]
